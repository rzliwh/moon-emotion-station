<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>月球雷达站</title>
<style>
:root {
  --space-black: #000511;
  --space-blue: #0d1b2a;
  --panel-blue: #1b263b;
  --moon-gray: #c8c8d0;
  --earth-blue: #378add;
  --warm-orange: #f4a261;
  --wave-blue: #4a90d9;
  --text-white: #e8e8e8;
  --text-muted: #8899aa;
  --green: #5cb85c;
  --purple: #c77dff;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--space-black); font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: var(--text-white); user-select: none; }
#canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
#canvas-container canvas { display: block; touch-action: none; }

#ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
#ui-layer > * { pointer-events: auto; }

#top-bar {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 20px;
  background: linear-gradient(to bottom, rgba(0,5,17,0.7), transparent);
}
#top-bar .title { font-size: 15px; font-weight: 500; letter-spacing: 2px; }
#top-bar .top-right { display: flex; align-items: center; gap: 16px; }
#top-bar .moonlight { font-size: 12px; color: var(--warm-orange); }
#top-bar .moonlight span { font-weight: 500; }
#top-bar .gear-btn {
  background: none; border: none; color: var(--text-muted);
  cursor: pointer; padding: 4px; display: flex; align-items: center;
  transition: color 0.2s;
}
#top-bar .gear-btn:hover { color: var(--text-white); }

#bottom-nav {
  position: absolute; bottom: 0; left: 0; right: 0;
  display: flex; justify-content: space-around; align-items: center;
  padding: 10px 0 16px;
  background: linear-gradient(to top, rgba(0,5,17,0.9), transparent);
}
.nav-btn {
  background: none; border: none; color: var(--text-muted);
  font-size: 12px; padding: 8px 16px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  transition: color 0.2s;
}
.nav-btn.active { color: var(--text-white); }
.nav-btn .nav-icon { font-size: 20px; line-height: 1; }

#signal-card-area {
  position: absolute; bottom: 70px; left: 16px; right: 16px;
  max-height: 50vh; overflow-y: auto;
}
.signal-card {
  background: rgba(27, 38, 59, 0.92);
  border: 0.5px solid rgba(74, 144, 217, 0.3);
  border-radius: 12px; padding: 16px;
  margin-bottom: 8px;
  backdrop-filter: blur(8px);
  animation: slideUp 0.4s ease;
}
.signal-card .signal-meta {
  font-size: 11px; color: var(--text-muted); margin-bottom: 8px;
  display: flex; justify-content: space-between;
}
.signal-card .signal-text {
  font-family: Georgia, "Source Han Serif SC", "Noto Serif SC", serif;
  font-size: 14px; line-height: 1.7; color: var(--text-white);
}
.signal-card .signal-hint {
  font-size: 11px; color: var(--wave-blue); margin-top: 10px;
  display: flex; align-items: center; gap: 4px;
}
.signal-card .signal-hint::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--wave-blue); animation: blink 1.5s infinite;
}

.action-options { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.action-btn {
  background: rgba(74, 144, 217, 0.1);
  border: 0.5px solid rgba(74, 144, 217, 0.4);
  border-radius: 8px; padding: 12px;
  color: var(--text-white); font-size: 13px; text-align: left;
  cursor: pointer; transition: all 0.2s;
  font-family: inherit;
}
.action-btn:hover, .action-btn:active {
  background: rgba(74, 144, 217, 0.25);
  border-color: var(--wave-blue);
}
.action-btn .action-label { font-weight: 500; }
.action-btn .action-desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

.reply-card {
  background: rgba(27, 38, 59, 0.95);
  border: 0.5px solid rgba(244, 162, 97, 0.4);
  border-radius: 12px; padding: 16px;
  margin-bottom: 8px;
  backdrop-filter: blur(8px);
  animation: slideUp 0.4s ease;
}
.reply-card .reply-label {
  font-size: 11px; color: var(--warm-orange); margin-bottom: 8px;
}
.reply-card .reply-text {
  font-family: Georgia, "Source Han Serif SC", "Noto Serif SC", serif;
  font-size: 14px; line-height: 1.7; color: var(--text-white);
}
.reply-card .reply-confirm {
  margin-top: 12px; width: 100%;
  background: rgba(244, 162, 97, 0.15);
  border: 0.5px solid rgba(244, 162, 97, 0.4);
  border-radius: 8px; padding: 10px;
  color: var(--warm-orange); font-size: 13px; cursor: pointer;
  font-family: inherit; transition: all 0.2s;
}
.reply-card .reply-confirm:hover { background: rgba(244, 162, 97, 0.3); }

.waiting-card {
  background: rgba(27, 38, 59, 0.85);
  border: 0.5px solid rgba(136, 153, 170, 0.2);
  border-radius: 12px; padding: 16px;
  text-align: center; backdrop-filter: blur(8px);
}
.waiting-card .waiting-text {
  font-size: 13px; color: var(--text-muted); line-height: 1.6;
}
.waiting-card .waiting-dots {
  margin-top: 8px; font-size: 16px; letter-spacing: 4px;
}
.waiting-card .waiting-dots span {
  display: inline-block; animation: dotPulse 1.4s infinite;
}
.waiting-card .waiting-dots span:nth-child(2) { animation-delay: 0.2s; }
.waiting-card .waiting-dots span:nth-child(3) { animation-delay: 0.4s; }

#trace-detail {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(27, 38, 59, 0.95);
  border: 0.5px solid rgba(244, 162, 97, 0.3);
  border-radius: 12px; padding: 20px;
  max-width: 320px; width: 80%;
  backdrop-filter: blur(12px); display: none;
  animation: fadeIn 0.3s ease;
}
#trace-detail .trace-type {
  font-size: 12px; color: var(--warm-orange); margin-bottom: 8px;
}
#trace-detail .trace-date {
  font-size: 11px; color: var(--text-muted); margin-bottom: 12px;
}
#trace-detail .trace-wave {
  font-family: Georgia, serif; font-size: 13px; line-height: 1.6;
  color: var(--text-white); margin-bottom: 12px;
  padding: 10px; background: rgba(0,5,17,0.4); border-radius: 8px;
}
#trace-detail .trace-close {
  width: 100%; background: none;
  border: 0.5px solid rgba(232, 232, 232, 0.2);
  border-radius: 8px; padding: 8px;
  color: var(--text-muted); font-size: 12px; cursor: pointer;
  font-family: inherit;
}

#settings-panel {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 5, 17, 0.92); backdrop-filter: blur(16px);
  display: none; flex-direction: column; padding: 20px;
  overflow-y: auto;
}
#settings-panel.active { display: flex; animation: fadeIn 0.3s; }
.settings-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px; padding-top: 8px;
}
.settings-header h2 { font-size: 18px; font-weight: 500; }
.settings-close {
  background: none; border: none; color: var(--text-muted);
  font-size: 20px; cursor: pointer; padding: 4px 8px;
}
.settings-section { margin-bottom: 24px; }
.settings-section h3 {
  font-size: 13px; color: var(--text-muted); margin-bottom: 12px;
  font-weight: 400;
}
.settings-info {
  background: rgba(27, 38, 59, 0.6); border-radius: 8px;
  padding: 14px; font-size: 13px; line-height: 1.8;
}
.settings-info .info-row { display: flex; justify-content: space-between; }
.settings-info .info-value { color: var(--warm-orange); font-weight: 500; }

.settings-btn {
  width: 100%; background: rgba(74, 144, 217, 0.1);
  border: 0.5px solid rgba(74, 144, 217, 0.3);
  border-radius: 8px; padding: 14px; margin-bottom: 8px;
  color: var(--text-white); font-size: 14px; cursor: pointer;
  font-family: inherit; text-align: left; transition: all 0.2s;
}
.settings-btn:hover { background: rgba(74, 144, 217, 0.2); }
.settings-btn.danger { border-color: rgba(226, 75, 74, 0.3); color: #e24b4a; }
.settings-btn.danger:hover { background: rgba(226, 75, 74, 0.1); }

#export-area {
  background: rgba(0,5,17,0.6); border-radius: 8px; padding: 12px;
  margin-top: 8px; display: none;
}
#export-area.active { display: block; }
#export-code {
  width: 100%; min-height: 80px; background: none; border: none;
  color: var(--text-muted); font-family: monospace; font-size: 11px;
  line-height: 1.5; resize: none; outline: none;
}
#export-area .copy-btn {
  margin-top: 8px; font-size: 12px; color: var(--wave-blue);
  background: none; border: 0.5px solid rgba(74,144,217,0.3);
  border-radius: 6px; padding: 6px 12px; cursor: pointer;
}

#import-area {
  background: rgba(0,5,17,0.6); border-radius: 8px; padding: 12px;
  margin-top: 8px; display: none;
}
#import-area.active { display: block; }
#import-code {
  width: 100%; min-height: 80px; background: rgba(0,5,17,0.4);
  border: 0.5px solid rgba(232,232,232,0.1); border-radius: 6px;
  color: var(--text-white); font-family: monospace; font-size: 11px;
  line-height: 1.5; resize: none; outline: none; padding: 8px;
}
#import-area .import-btn {
  margin-top: 8px; width: 100%;
  background: rgba(92,184,92,0.15); border: 0.5px solid rgba(92,184,92,0.3);
  border-radius: 6px; padding: 10px; color: var(--green);
  font-size: 13px; cursor: pointer; font-family: inherit;
}

#toast {
  position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
  background: rgba(27, 38, 59, 0.95); border-radius: 8px;
  padding: 10px 20px; font-size: 13px; color: var(--text-white);
  backdrop-filter: blur(8px); opacity: 0; transition: opacity 0.3s;
  pointer-events: none; z-index: 100;
}
#toast.show { opacity: 1; }

#loading-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: var(--space-black); z-index: 200;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; transition: opacity 0.6s;
}
#loading-screen.hidden { opacity: 0; pointer-events: none; }
#loading-screen .loading-text { font-size: 14px; color: var(--text-muted); letter-spacing: 2px; }
#loading-screen .loading-dots { font-size: 20px; color: var(--wave-blue); }
#loading-screen .loading-dots span { display: inline-block; animation: dotPulse 1.4s infinite; }
#loading-screen .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
#loading-screen .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

#intro-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,5,17,0.85); z-index: 150;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px; text-align: center; gap: 20px;
  transition: opacity 0.5s;
}
#intro-overlay.hidden { opacity: 0; pointer-events: none; }
#intro-overlay h1 { font-size: 24px; font-weight: 500; letter-spacing: 3px; }
#intro-overlay p { font-size: 14px; line-height: 1.8; color: var(--text-muted); max-width: 300px; }
#intro-overlay .intro-btn {
  margin-top: 12px; background: rgba(244,162,97,0.15);
  border: 0.5px solid rgba(244,162,97,0.4); border-radius: 12px;
  padding: 14px 40px; color: var(--warm-orange); font-size: 15px;
  cursor: pointer; font-family: inherit; transition: all 0.2s;
}
#intro-overlay .intro-btn:hover { background: rgba(244,162,97,0.3); }

@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
@keyframes dotPulse { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

@media (max-width: 480px) {
  #top-bar .title { font-size: 13px; }
  .signal-card .signal-text { font-size: 13px; }
}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-text">连接月球信号</div>
  <div class="loading-dots"><span>.</span><span>.</span><span>.</span></div>
</div>

<div id="canvas-container"></div>

<div id="ui-layer">
  <div id="top-bar">
    <div class="title">月球雷达站</div>
    <div class="top-right">
      <div class="moonlight">月光 <span id="moonlight-value">0</span></div>
      <button class="gear-btn" onclick="document.getElementById('settings-panel').classList.add('active')" aria-label="设置">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2">
          <circle cx="10" cy="10" r="2.5"/>
          <path d="M10 1.5v2.5M10 16v2.5M1.5 10h2.5M16 10h2.5M3.8 3.8l1.8 1.8M14.4 14.4l1.8 1.8M3.8 16.2l1.8-1.8M14.4 5.6l1.8-1.8"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="signal-card-area"></div>

  <div id="trace-detail">
    <div class="trace-type" id="trace-type-text"></div>
    <div class="trace-date" id="trace-date-text"></div>
    <div class="trace-wave">
      <div class="trace-wave-label">来自地球的电波</div>
      <div id="trace-wave-text"></div>
    </div>
    <div class="trace-wave">
      <div class="trace-wave-label">月球上的回信</div>
      <div id="trace-reply-text"></div>
    </div>
    <button class="trace-close" onclick="document.getElementById('trace-detail').style.display='none'">收回</button>
  </div>

  <div id="bottom-nav">
    <button class="nav-btn active" data-tab="signals">
      <span>电波</span>
    </button>
    <button class="nav-btn" data-tab="moon">
      <span>月球</span>
    </button>
    <button class="nav-btn" data-tab="memory">
      <span>记忆</span>
    </button>
  </div>

  <div id="settings-panel">
    <div class="settings-header">
      <h2>设置</h2>
      <button class="settings-close" onclick="document.getElementById('settings-panel').classList.remove('active')">x</button>
    </div>

    <div class="settings-section">
      <h3>我的月球</h3>
      <div class="settings-info">
        <div class="info-row"><span>痕迹数量</span><span class="info-value" id="trace-count">0</span></div>
        <div class="info-row"><span>月光值</span><span class="info-value" id="moonlight-display">0</span></div>
        <div class="info-row"><span>创建时间</span><span class="info-value" id="created-at">-</span></div>
      </div>
    </div>

    <div class="settings-section">
      <h3>数据管理</h3>
      <button class="settings-btn" onclick="App.testReply()" style="border-color: rgba(244,162,97,0.3); color: var(--warm-orange);">测试：立即收到回信</button>
      <button class="settings-btn" onclick="App.exportData()">导出我的月球</button>
      <div id="export-area">
        <textarea id="export-code" readonly></textarea>
        <button class="copy-btn" onclick="App.copyExportCode()">复制迁移码</button>
      </div>
      <button class="settings-btn" onclick="document.getElementById('import-area').classList.toggle('active')">导入月球</button>
      <div id="import-area">
        <textarea id="import-code" placeholder="粘贴迁移码..."></textarea>
        <button class="import-btn" onclick="App.importData()">恢复痕迹</button>
      </div>
      <button class="settings-btn danger" onclick="App.clearAll()">清除所有数据</button>
    </div>

    <div class="settings-section">
      <h3>关于</h3>
      <div class="settings-info" style="font-size:12px; color: var(--text-muted); line-height: 1.8;">
        月球雷达站 v2.0<br>
        月球背面，有人在听。<br>
        每一条电波，都值得被回应。
      </div>
    </div>
  </div>

  <div id="intro-overlay">
    <h1>月球雷达站</h1>
    <p>月球背面，有一间小小的雷达站。<br>它接收来自地球的情绪电波，<br>等待你从月球上，给出一个回应。</p>
    <button class="intro-btn" onclick="App.startGame()">开始收听</button>
  </div>

  <div id="toast"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script src="js/audio.js"></script>
<script type="module" src="js/app.js?v=20260802-defensive"></script>

</body>
</html>
